<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Variant of logo.svg for 16 and 24 pixels: without the lens, with thicker
       lines. At that size the lens is only a grey blur; the three coloured
       rows are what stays recognisable. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a62a3"/>
      <stop offset="1" stop-color="#4b3259"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#bg)"/>
  <circle cx="62" cy="62" r="26" fill="#f0b341"/>
  <rect x="104" y="40" width="120" height="44" rx="22" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="62" cy="128" r="26" fill="#ef5a4f"/>
  <rect x="104" y="106" width="120" height="44" rx="22" fill="#ffffff"/>
  <circle cx="62" cy="194" r="26" fill="#8db4ea"/>
  <rect x="104" y="172" width="72" height="44" rx="22" fill="#ffffff" fill-opacity="0.6"/>
</svg>
