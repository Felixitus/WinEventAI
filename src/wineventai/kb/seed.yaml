- provider: Microsoft-Windows-WHEA-Logger
  event_id: 17
  meaning: >
    The hardware reported an error and corrected it itself. A single one is
    unremarkable; at a rising rate it is an early warning.
  typical_causes: [Memory starting to fail, PCIe transmission errors, Temperature]
  checks: [Look at the rate over time, Determine the affected component from the event data]
  severity_default: warning
  confidence: verified
  checked_on: "2026-09-10"
  checked_by: "seed"

