- provider: Application Error
  event_id: 1000
  meaning: >
    An application was terminated by an unhandled exception. The event data
    name program, version, faulting module and exception code.
  typical_causes:
    - Bug in the application or a loaded module
    - Damaged program files
    - Defective memory, when many different programs are affected
  checks:
    - Always the same faulting module
    - Closeness in time to an installation or an update
  severity_default: error
  confidence: verified
  checked_on: "2026-09-10"
  checked_by: "seed"

