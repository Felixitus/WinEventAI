# Bundled knowledge base.
#
# Deliberately small and verified instead of large and half-baked. The key is
# always provider + event_id.
#
# confidence:
#   verified   - meaning is reliable; embedded in the prompt.
#   unverified - meaning is plausible but not verified; NOT in the prompt, the
#                report marks the finding as unverified.
#   empty      - no meaning on record.
#
# The texts are our own wording. Sources are linked instead of copied - that
# solves copyright and traceability in one go, and the real value is in
# "typical_causes" and "checks" anyway, not in the documentation.

- provider: Microsoft-Windows-Kernel-Power
  event_id: 41
  meaning: >
    At boot Windows notices that the system was not shut down properly before.
    The entry therefore describes, in hindsight, the end of the previous
    session.
  typical_causes:
    - Loss of power
    - Stop error without completed logging
    - Shutdown by overheating protection
  checks:
    - Look for a BugCheck 1001 close in time
    - Match the minidump timestamp
    - Check WHEA-Logger events in the same period
  severity_default: critical
  source_url: "https://learn.microsoft.com/windows/client-management/troubleshoot-event-id-41-restart"
  confidence: verified
  checked_on: "2026-09-10"
  checked_by: "seed"

- provider: EventLog
  event_id: 6008
  meaning: >
    The previous system shutdown was unexpected. Written at the next boot and
    names the time of the last known operation.
  typical_causes:
    - Loss of power
    - Hard power-off
    - Crash
  checks:
    - Match with Kernel-Power 41
    - For virtual machines, consult the host logs
  severity_default: critical
  confidence: verified
  checked_on: "2026-09-10"
  checked_by: "seed"

- provider: EventLog
  event_id: 6005
  meaning: The event log service was started. Marks the beginning of a boot session.
  typical_causes: [System start]
  checks: [If the preceding 6006 is missing, the shutdown was unclean]
  severity_default: info
  confidence: verified
  checked_on: "2026-09-10"
  checked_by: "seed"

- provider: EventLog
  event_id: 6006
  meaning: The event log service was stopped. Marks a regular shutdown.
  typical_causes: [Regular shutdown or restart]
  checks: [Use as the counterpart of 6005 for the timeline]
  severity_default: info
  confidence: verified
  checked_on: "2026-09-10"
  checked_by: "seed"

- provider: Microsoft-Windows-WER-SystemErrorReporting
  event_id: 1001
  meaning: >
    Summary of a stop error after the restart. Contains the stop code and
    parameters as well as the path of the memory dump that was written.
  typical_causes:
    - Driver fault
    - Defective memory
    - Fault in the storage path
  checks:
    - Determine and look up the stop code
    - Check recently changed drivers
    - Analyze the memory dump outside this tool
  severity_default: critical
  source_url: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-code-reference2"
  confidence: verified
  checked_on: "2026-09-10"
  checked_by: "seed"

- provider: Service Control Manager
  event_id: 7031
  meaning: >
    A service terminated unexpectedly. The entry names how often this has
    happened already and which recovery action was started.
  typical_causes:
    - Crash of the service process
    - Missing dependency
    - Out of memory
  checks:
    - Look for simultaneous Application Error entries for the same process
    - Look at the repetition pattern over time
  severity_default: error
  confidence: verified
  checked_on: "2026-09-10"
  checked_by: "seed"

- provider: Service Control Manager
  event_id: 7034
  meaning: A service terminated unexpectedly without a recovery action taking effect.
  typical_causes: [Crash of the service process, Termination by security software]
  checks: [Check the service account, Consult the application's own logs]
  severity_default: error
  confidence: verified
  checked_on: "2026-09-10"
  checked_by: "seed"

- provider: Service Control Manager
