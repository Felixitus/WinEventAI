# Mitgelieferte Wissensbasis.
#
# Bewusst klein und geprueft statt gross und halbgar. Der Schluessel ist immer
# provider + event_id.
#
# confidence:
#   sicher   - Bedeutung belastbar; wird in den Prompt eingebettet.
#   unsicher - Bedeutung plausibel, aber nicht verifiziert; NICHT in den Prompt,
#              der Bericht kennzeichnet den Befund als ungeprueft.
#   leer     - keine Bedeutung hinterlegt.
#
# Die Texte sind eigene Formulierungen. Quellen werden verlinkt statt kopiert -
# das loest Urheberrecht und Nachvollziehbarkeit in einem Zug, und der eigentliche
# Wert steht ohnehin in "typische_ursachen" und "checks", nicht in der Doku.

- provider: Microsoft-Windows-Kernel-Power
  event_id: 41
  bedeutung: >
    Beim Hochfahren stellt Windows fest, dass das System zuvor nicht ordnungsgemaess
    heruntergefahren wurde. Der Eintrag beschreibt damit rueckblickend das Ende der
    vorherigen Sitzung.
  typische_ursachen:
    - Stromverlust
    - Stoppfehler ohne abgeschlossene Protokollierung
    - Abschaltung durch Ueberhitzungsschutz
  checks:
    - Zeitnahen BugCheck 1001 suchen
    - Minidump-Zeitstempel abgleichen
    - WHEA-Logger-Ereignisse im selben Zeitraum pruefen
  severity_default: kritisch
  quelle_url: "https://learn.microsoft.com/windows/client-management/troubleshoot-event-id-41-restart"
  confidence: sicher
  geprueft_am: "2026-09-10"
  geprueft_von: "seed"

- provider: EventLog
  event_id: 6008
  bedeutung: >
    Das vorherige Herunterfahren des Systems war unerwartet. Wird beim naechsten
    Start geschrieben und nennt den Zeitpunkt des letzten bekannten Betriebs.
  typische_ursachen:
    - Stromverlust
    - Harter Ausschalter
    - Absturz
  checks:
    - Mit Kernel-Power 41 abgleichen
    - Bei virtuellen Maschinen die Host-Protokolle heranziehen
  severity_default: kritisch
  confidence: sicher
  geprueft_am: "2026-09-10"
  geprueft_von: "seed"

