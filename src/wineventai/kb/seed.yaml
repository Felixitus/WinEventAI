- provider: Microsoft-Windows-WER-SystemErrorReporting
  event_id: 1001
  bedeutung: >
    Zusammenfassung eines Stoppfehlers nach dem Neustart. Enthaelt Stopcode und
    Parameter sowie den Pfad des erzeugten Speicherabbilds.
  typische_ursachen:
    - Treiberfehler
    - Defekter Arbeitsspeicher
    - Fehler im Speicherpfad
  checks:
    - Stopcode bestimmen und zuordnen
    - Zuletzt geaenderte Treiber pruefen
    - Speicherabbild ausserhalb dieses Werkzeugs auswerten
  severity_default: kritisch
  quelle_url: "https://learn.microsoft.com/windows-hardware/drivers/debugger/bug-check-code-reference2"
  confidence: sicher
  geprueft_am: "2026-09-10"
  geprueft_von: "seed"

