# Fixed scenarios for 'wineventai ai bench'.
#
# Every scenario is a small, invented but realistic event stream. The bench
# sends it through the SAME path as a real run - enrich, rules, redaction,
# bundle, model, evidence check - so that the acceptance test measures what
# the report will show, not a prompt written for the test.
#
# Rules for new scenarios:
# - Every scenario must produce at least one finding with the bundled rules
#   (a test checks that), otherwise the model is never asked.
# - Use English messages: the prompts are English, and the language check of
#   the bench is meant to measure the model, not the input.
# - Leave personal data in (user paths, host names): the redaction has to
#   replace them, and the model must not invent placeholders of its own.
# - Times are seconds before 'end_utc'. The fixed end keeps the bundles
#   identical between runs, so that two bench results can be compared.

end_utc: "2026-01-15T10:00:00Z"

scenarios:
  - id: unclean-restart
    title: Unclean restart after disk retries
    host: WS-4711
    events:
      - seconds_before: 0
        channel: System
        provider: EventLog
        event_id: 6005
        level: 4
        message: "The Event log service was started."
      - seconds_before: 2
        channel: System
        provider: EventLog
        event_id: 6008
        level: 2
        message: "The previous system shutdown at 09:47:12 on 15.01.2026 was unexpected."
        properties: ["09:47:12", "15.01.2026", "", "", "", "", ""]
      - seconds_before: 3
        channel: System
        provider: Microsoft-Windows-Kernel-Power
        event_id: 41
        level: 1
        message: >-
          The system has rebooted without cleanly shutting down first. This error
          could be caused if the system stopped responding, crashed, or lost power
          unexpectedly.
        properties: ["0", "0x0", "0x0", "0x0", "0x0", "0x0", "false", "0"]
      - seconds_before: 150
        channel: System
        provider: disk
        event_id: 153
        level: 3
        message: >-
          The IO operation at logical block address 0x2f0e18 for Disk 1 (PDO name:
          \Device\0000003a) was retried.
        properties: ["\\Device\\Harddisk1\\DR1", "0x2f0e18", "1", "\\Device\\0000003a"]
      - seconds_before: 190
        channel: System
        provider: disk
        event_id: 153
        level: 3
        message: >-
          The IO operation at logical block address 0x2f0e20 for Disk 1 (PDO name:
          \Device\0000003a) was retried.
        properties: ["\\Device\\Harddisk1\\DR1", "0x2f0e20", "1", "\\Device\\0000003a"]
      - seconds_before: 240
        channel: System
        provider: disk
        event_id: 51
        level: 3
        message: "An error was detected on device \\Device\\Harddisk1\\DR1 during a paging operation."
        properties: ["\\Device\\Harddisk1\\DR1"]

