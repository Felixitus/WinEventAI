# Noise.
#
# These events appear in large numbers on practically every Windows system and
# as a rule are not pathological. They are recognized, classified and
# suppressed by default - visible with --show-noise. Without this
# classification a report is useless, because the real findings drown in it.

- id: dcom-10016
  name: DCOM permission (DistributedCOM 10016)
  match:
    channel: System
    provider: [Microsoft-Windows-DistributedCOM, DCOM]
    event_id: 10016
  severity: noise
  classification: noise
  meaning: >
    A component wanted to start a DCOM object and lacked the rights to do so.
    In these cases Windows practically always falls back to another path;
    there are almost never visible effects.
  typical_causes:
    - Default permissions of Windows components
    - Services that access early during startup
  recommended_checks:
    - Only follow up if a concrete malfunction matches it exactly in time.
    - Do NOT change permissions as a precaution - that is a well-known mistake.
  reference: "https://learn.microsoft.com/troubleshoot/windows-client/application-management/event-10016-logged-when-accessing-dcom"

- id: dhcp-warning-1003
  name: DHCP address not renewed (Dhcp-Client 1003)
  match:
    channel: System
    provider: [Microsoft-Windows-Dhcp-Client, Dhcp]
    event_id: 1003
  severity: noise
  classification: noise
  meaning: >
    The DHCP client could not obtain an address. On mobile devices that is the
    normal state when switching between networks.
  typical_causes:
    - Network change on notebooks
    - Wi-Fi briefly unavailable
  recommended_checks:
    - Only relevant if it piles up on a stationary device.
  threshold:
    count_min: 1
    burst_required: false

- id: perflib-1008
  name: Performance counter not loadable (Perflib 1008/1023)
  match:
    channel: Application
    provider: [Microsoft-Windows-Perflib, Perflib]
    event_id: [1008, 1023]
  severity: noise
  classification: noise
  meaning: >
    A performance counter library could not be loaded. This only affects
    performance monitoring, not the operation of the application.
  typical_causes:
    - Leftovers of an uninstalled application
    - Damaged counter registration
  recommended_checks:
    - Only follow up if performance data is actually needed.

- id: dns-client-1014
  name: Name resolution without answer (DNS Client 1014)
  match:
    channel: System
    provider: Microsoft-Windows-DNS-Client
    event_id: 1014
  severity: noise
  classification: noise
  meaning: >
    A name query ran into a timeout. A single one is unremarkable; in dense
    bundles it is a network hint - which is why a burst is required here for
    the rule to fire at all.
  typical_causes:
    - Brief network disturbance
    - Unreachable DNS server
    - Power saving of the network adapter
  recommended_checks:
    - Only follow up when bundled; then check the network path and DNS server.
  threshold:
    count_min: 20
    burst_required: true
