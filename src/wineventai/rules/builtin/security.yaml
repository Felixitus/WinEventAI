# Security indicators. Only active with --security.
#
# All results of these rules are explicitly INDICATIONS, not forensic
# findings. The report marks this everywhere.
#
# Just as important: if the required audit policy is missing, "not logged" must
# be reported, not "no finding". That is done by security/audit_policy.py, not
# by this file.

- id: sec-log-cleared
  name: Security log cleared (1102)
  match:
    channel: Security
    provider: Microsoft-Windows-Eventlog
    event_id: 1102
  severity: critical
  security_indicator: true
  meaning: >
    The security log was cleared. In normal operation that is a rare,
    deliberate act and always needs an explanation.
  typical_causes:
    - Covering tracks
    - Deliberate cleanup by administrators
    - Automation of a management tool
  recommended_checks:
    - Record the executing account and the time.
    - Were there logons from outside close in time (4624 logon type 10)?
    - Check existing backups of the logs.

- id: sec-log-cleared-104
  name: Log cleared (104)
  match:
    channel: System
    provider: Microsoft-Windows-Eventlog
    event_id: 104
  severity: error
  security_indicator: true
  meaning: >
    An event log was cleared. Unlike 1102 this also covers channels other than
    Security.
  typical_causes:
    - Cleanup by administrators or management software
    - Covering tracks
  recommended_checks:
    - Record the affected channel and the executing account.
    - Match it against the gaps in the timeline.

- id: sec-audit-policy-changed
  name: Audit policy changed (4719)
  match:
    channel: Security
    provider: Microsoft-Windows-Security-Auditing
    event_id: 4719
  severity: error
  security_indicator: true
  meaning: >
    The system audit policy was changed. If a category is switched off, no
    events are produced from that point on - that is not inconspicuousness but
    a gap.
  typical_causes:
    - Change via group policy
    - Deliberate disabling of logging
  recommended_checks:
    - Which subcategory was changed, and in which direction?
    - From when on are which events missing because of it?

- id: sec-logon-failure-series
  name: Logon failures in series (4625)
  match:
    channel: Security
    provider: Microsoft-Windows-Security-Auditing
    event_id: 4625
  severity: warning
  security_indicator: true
  meaning: >
    Repeatedly failed logons. Single failed attempts are everyday life; a dense
    series is an indication of systematic guessing.
  typical_causes:
    - Forgotten password, expired credentials
    - Service with outdated credentials
    - Systematic password guessing
  recommended_checks:
    - One account or many? One source or many?
    - Was the series followed by a successful logon (4624)?
    - Determine the origin of the logon attempts.
  threshold:
    count_min: 10
    burst_required: true
    escalate_above: 100
    escalate_to: error

- id: sec-remote-logon
  name: Logon via Remote Desktop (4624 logon type 10)
  match:
    channel: Security
    provider: Microsoft-Windows-Security-Auditing
    event_id: 4624
    data:
      LogonType: "^10$"
  severity: warning
  security_indicator: true
  meaning: >
    Successful interactive logon over the network (Remote Desktop). Completely
    normal on its own - not in combination with other indicators.
  typical_causes:
    - Regular remote maintenance
    - Access from outside with stolen credentials
  recommended_checks:
    - Check account, time and source address against expected operation.
    - Did the logon happen outside the usual working hours?

- id: sec-account-and-group
  name: Account created or group extended (4720/4728/4732)
  match:
    channel: Security
    provider: Microsoft-Windows-Security-Auditing
    event_id: [4720, 4728, 4732]
  severity: error
  security_indicator: true
  meaning: >
    A user account was created or added to a group. For privileged groups this
    is the classic step to make access permanent.
  typical_causes:
    - Regular user administration
    - Creation of an account for permanent use by third parties
  recommended_checks:
    - Was the account created by the responsible party?
    - Which group is it - administrative or not?

- id: sec-new-service
  name: New service installed (7045/4697)
  match:
    provider: [Service Control Manager, Microsoft-Windows-Security-Auditing]
    event_id: [7045, 4697]
  severity: error
  security_indicator: true
  meaning: >
    A new service was installed on the system. Services start automatically
    with high privileges and are therefore a preferred way to persist.
  typical_causes:
    - Software installation
    - Management or remote maintenance tool
    - Persistence set up by an attacker
  recommended_checks:
    - Check service name and program path - is it in an unusual place?
    - Does the installation match a known activity?

- id: sec-powershell-scriptblock
  name: PowerShell script block (4104/4103)
  match:
    provider: Microsoft-Windows-PowerShell
    event_id: [4104, 4103]
  severity: warning
  security_indicator: true
  meaning: >
    PowerShell logged executed script code. Without script block logging
    enabled, these events are only produced for blocks rated as suspicious - so
    their absence is no proof of inconspicuousness.
  typical_causes:
    - Regular administration scripts
    - Management software
    - Execution of foreign code
  recommended_checks:
    - Is script block logging active at all? Otherwise the view is incomplete.
    - Encoded commands or downloading of content in the script block?

- id: sec-process-creation
  name: Process creation with command line (4688)
  match:
    channel: Security
    provider: Microsoft-Windows-Security-Auditing
    event_id: 4688
  severity: info
  security_indicator: true
  meaning: >
    A process was started. Only with command-line logging enabled does the call
    itself appear in it - without it the value is low.
  typical_causes:
    - Normal operation
  recommended_checks:
    - Is command-line logging active?
    - "Conspicuous calls: encoded commands, execution from temporary paths."
