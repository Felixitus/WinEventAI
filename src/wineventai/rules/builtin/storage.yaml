# Disks and file system.
#
# These providers are written in lower case ("disk", "storahci", "Ntfs") and
# all live in the System channel. "Microsoft-Windows-StorAhci" as a channel of
# its own does not exist to current knowledge - 'wineventai doctor' checks
# this on the target system.

- id: disk-io-error
  name: I/O error on the disk (disk 51/153)
  match:
    channel: System
    provider: disk
    event_id: [51, 153]
  severity: critical
  meaning: >
    An error occurred while reading or writing. 153 means the access succeeded
    after a retry - so the disk is already working at the edge of its
    reliability.
  typical_causes:
    - Disk starting to fail, bad sectors
    - Loose or defective cable, weak power supply
    - Overloaded or faulty controller
    - "For virtual machines: bottleneck in the underlying storage"
  recommended_checks:
    - Check SMART and reliability values (collect.disk_health).
    - Do the events cluster in bundles? Then cable or controller is more likely.
    - Check the backup before testing any further.
  threshold:
    count_min: 1
    escalate_above: 10
    escalate_to: critical

- id: storahci-reset-129
  name: Device reset at the controller (storahci/stornvme 129)
  match:
    channel: System
    provider: [storahci, stornvme, iaStorA, iaStorAC]
    event_id: 129
  severity: critical
  meaning: >
    The storage controller had to reset the device because a command was not
    answered in the expected time.
  typical_causes:
    - Disk answers too slowly, starting to fail
    - Faulty firmware of the disk or the controller
    - Power-saving functions of the controller (LPM) with SSDs
    - Cabling
  recommended_checks:
    - Check the firmware versions of disk and controller.
    - For SSDs, check the controller's power-saving behavior.
    - Look at the correlation in time with application hangs (1002).

- id: ntfs-filesystem-corruption
  name: File system corruption (Ntfs 55)
  match:
    channel: System
    provider: [Ntfs, Microsoft-Windows-Ntfs]
    event_id: 55
  severity: critical
  meaning: >
    The structure of the file system on a disk is damaged. Windows reports a
    state that does not improve without a check.
  typical_causes:
    - Unclean shutdown during write operations
    - Bad sectors
    - Faulty driver in the storage path
  recommended_checks:
    - Check the backup before repairing anything.
    - Schedule a disk check - this tool does not run it.
    - Check for closeness in time to Kernel-Power 41.
