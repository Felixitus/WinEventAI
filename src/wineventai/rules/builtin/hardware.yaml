# Hardware and drivers.

- id: whea-corrected
  name: Corrected hardware error (WHEA-Logger 17/19)
  match:
    channel: System
    provider: Microsoft-Windows-WHEA-Logger
    event_id: [17, 19]
  severity: warning
  meaning: >
    The hardware reported an error and corrected it itself. A single one is
    unremarkable; in series it is an early warning, usually for memory, the
    processor cache or PCIe links.
  typical_causes:
    - Memory starting to fail
    - PCIe link with transmission errors
    - Overclocking or borderline voltages
    - Temperature
  recommended_checks:
    - Look at the frequency over time - a rising rate is the real signal.
    - Determine the affected component from the event data.
    - Check BIOS/UEFI and firmware versions.
  threshold:
    count_min: 1
    escalate_above: 25
    escalate_to: error

- id: whea-uncorrected
  name: Uncorrected hardware error (WHEA-Logger 18/47)
  match:
    channel: System
    provider: Microsoft-Windows-WHEA-Logger
    event_id: [18, 47]
  severity: critical
  meaning: >
    The hardware reported an error it could not correct. As a rule this leads
    to a stop error.
  typical_causes:
    - Defective memory
    - Processor or mainboard fault
    - Unstable power supply
  recommended_checks:
    - Check for closeness in time to BugCheck 1001.
    - Memory test, then component replacement.

- id: kernel-pnp-219
  name: Driver not loaded (Kernel-PnP 219)
  match:
    channel: [System, Microsoft-Windows-Kernel-PnP/Configuration]
    provider: Microsoft-Windows-Kernel-PnP
    event_id: 219
  severity: warning
  meaning: >
    A driver could not be loaded for a device. The device therefore remains
    fully or partially non-functional.
  typical_causes:
    - Driver missing, damaged or not matching the Windows version
    - Signature check fails
    - Device registers itself incorrectly
  recommended_checks:
    - Find the device in Device Manager and note the error code.
    - Look at setupapi.dev.log for related error lines (collect.log_files).
    - Check for closeness in time to a Windows update.

- id: windowsupdate-failure
  name: Update failed (WindowsUpdateClient 20/25/31)
  match:
    channel: Microsoft-Windows-WindowsUpdateClient/Operational
    provider: Microsoft-Windows-WindowsUpdateClient
    event_id: [20, 25, 31]
  severity: warning
  meaning: >
    An update could not be installed or downloaded.
  typical_causes:
    - Component store damaged
    - Too little free disk space
    - Network or proxy problem
    - Conflict with security software
  recommended_checks:
    - Look at CBS.log for error lines (collect.log_files).
    - Check free space on the system partition.
    - Does the same update error repeat? Then it is not a random problem.
