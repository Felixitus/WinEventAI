# Bundled defaults. Do not edit - own values belong in
# %LOCALAPPDATA%\WinEventAI\wineventai.yaml or in a file passed via --config.

log_level: info

collect:
  # Global time window in days. Can be overridden per channel and via --days.
  days: 7

  # Upper limit for RETAINED raw data per channel. Everything is always read;
  # above this limit the channel degrades to aggregates and the report says so
  # visibly.
  max_retained_per_channel: 200000

  # Hard abort for absurd volumes, with a suggestion instead of a stack trace.
  abort_above_records: 5000000

  # Wall clock per channel. A hanging channel is marked "timed out" and does
  # not kill the run.
  channel_timeout_seconds: 120

  powershell_preference: [pwsh, powershell]

  # Provider:ID pairs for which the full event XML is fetched, because the
  # named EventData fields are needed (language-neutral, unlike the message
  # text).
  xml_for:
    - "Microsoft-Windows-WER-SystemErrorReporting:1001"
    - "Microsoft-Windows-Security-Auditing:4624"
    - "Microsoft-Windows-Security-Auditing:4625"
    - "Microsoft-Windows-Security-Auditing:4688"
    - "Microsoft-Windows-Security-Auditing:4720"
    - "Microsoft-Windows-Security-Auditing:4728"
    - "Microsoft-Windows-Security-Auditing:4732"
    - "Microsoft-Windows-Security-Auditing:4697"
    - "Microsoft-Windows-Security-Auditing:4719"
    - "Service Control Manager:7045"

  channels:
    - name: System
    - name: Application
    - name: Setup
    # Security is orders of magnitude larger than System. Hence a shorter
    # window AND a server-side id filter - never read it unfiltered.
    - name: Security
      enabled: false
      requires_admin: true
      days: 3
      with_xml: true
      event_ids: [1102, 4104, 4103, 4624, 4625, 4688, 4697, 4719, 4720, 4728, 4732]
    # Microsoft-Windows-Kernel-Power/Operational used to be listed here. That
    # channel does not exist on Windows 11 (build 26200, observed); Kernel-Power
    # 41 lives in the System channel anyway. Where it does exist, the error
    # sweep below picks it up.
    - name: Microsoft-Windows-WindowsUpdateClient/Operational
    - name: Microsoft-Windows-Kernel-PnP/Configuration
    # Note: WHEA-Logger (17/19) and storahci (129) are providers in the System
    # channel, not channels of their own. 'wineventai doctor' checks this on
    # the target system instead of silently filtering on missing channels.

  # Error sweep: all other active channels, but only critical (1) and error
  # (2). The channels configured above are skipped. A channel the sweep did not
  # reach shows up in the report as "timed out" - never as "no hits".
  error_sweep:
    enabled: true
    levels: [1, 2]
    log_types: [Administrative, Operational]
    exclude: []
    days: null
    max_retained_per_channel: 5000
    timeout_seconds: 600

  reliability_records: true
  wer_reports: true
  minidump_listing: true
  log_files: false
  disk_health: false
  inventory: false

enrich:
  burst_factor: 5.0
  burst_min_count: 10
  context_window_minutes: 5
  context_max_events: 60
  samples_per_group: 3
  retention_error_share: 0.6
  sampling_seed: 1701

rules:
  overlay_dir: null      # null means %LOCALAPPDATA%\WinEventAI\rules
  suppress_noise: true
  security_mode: false

# Optional. Without a running Ollama the report is still complete; it is then
# built from the rule engine alone and says so.
ai:
  enabled: true
  base_url: "http://localhost:11434"
  model: "qwen2.5:14b-instruct"
  temperature: 0.1
  # Always set explicitly. Ollama's default is small and silently truncates
  # long prompts. The value actually used is additionally capped by /api/show.
  num_ctx: 16384
  timeout_seconds: 180
  max_bundle_tokens: 6000
  chars_per_token: 3.2
  max_samples_per_finding: 3
  message_excerpt_chars: 400
  # Without this opt-in only localhost is accepted - and no model that Ollama
  # itself forwards to a cloud service (e.g. "*:cloud" models).
  allow_cloud: false
  redact: true
  # Acceptance thresholds of 'wineventai ai bench'. The bench runs fixed
  # scenarios through the real pipeline and checks every installed model
  # against them; it changes nothing, it only recommends.
  bench:
    min_context_length: 32768   # the model must support at least this
    max_rejected_share: 0.2     # share of statements the evidence check may reject
    rejection_tolerance: 0.1    # closer to the best than this counts as equal; then speed decides
    timeout_seconds: 600        # per call; the first call also loads the model

# Context probes. They measure the CURRENT state related to a finding - a ping
# to the DNS server for DNS Client 1014, the service state for SCM 7031, disk
# values for disk 153. Every probe hangs on a finding; there is deliberately no
# menu of free-standing tools.
#
# Probes only run on the machine the run came from: whoever analyzes a
# server's run on a workstation gets no measurement, but a note that it would
# describe the wrong machine.
#
# There is no internet speed test. It would break "works offline", "no
# telemetry" and "read-only" all at once.
probes:
  enabled: true
  network: true          # DNS server, default gateway, DHCP server
  services: true         # service state for SCM 7000/7009/7031/7034
  storage: true          # health, overall SMART status, usage
  time: true             # W32Time state; offset only to time sources in the LAN
  time_max_offset_seconds: 2.0
  timeout_seconds: 30
  ping_count: 3
  ping_timeout_ms: 1500

report:
  formats: [html, md, json]
  redacted: false
  # Comparison with the previous run of the same machine: new findings,
  # findings not seen in this window, findings that became more frequent
  # (per day, because the windows may differ in length).
  compare:
    enabled: true
    increase_factor: 2.0   # at least this many times more per day
    min_count: 3           # and at least this many hits - 1 -> 2 is no trend
  raw_appendix_limit: 200
  title: "WinEventAI diagnostic report"
