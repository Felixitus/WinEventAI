# Mitgelieferte Vorgabewerte. Nicht bearbeiten - eigene Werte gehoeren nach
# %PROGRAMDATA%\WinEventAI\wineventai.yaml oder in eine Datei hinter --config.

log_level: info

collect:
  # Globales Zeitfenster in Tagen. Ueberschreibbar je Kanal und per --days.
  days: 7

  # Obergrenze fuer BEHALTENE Rohdaten je Kanal. Gelesen wird immer alles;
  # oberhalb dieser Grenze degradiert der Kanal auf Aggregate und der Bericht
  # vermerkt das sichtbar.
  max_retained_per_channel: 200000

  # Harter Abbruch bei absurden Mengen, mit Vorschlag statt Stacktrace.
  abort_above_records: 5000000

  # Wall-Clock je Kanal. Ein haengender Kanal wird als "abgebrochen" markiert
  # und toetet nicht den Lauf.
  channel_timeout_seconds: 120

  powershell_preference: [pwsh, powershell]

  # Provider:ID-Paare, fuer die das vollstaendige Event-XML geholt wird, weil
  # die benannten EventData-Felder gebraucht werden (sprachneutral, anders als
  # der Meldungstext).
  xml_for:
    - "Microsoft-Windows-WER-SystemErrorReporting:1001"
    - "Microsoft-Windows-Security-Auditing:4624"
    - "Microsoft-Windows-Security-Auditing:4625"
    - "Microsoft-Windows-Security-Auditing:4688"
    - "Microsoft-Windows-Security-Auditing:4720"
    - "Microsoft-Windows-Security-Auditing:4728"
    - "Microsoft-Windows-Security-Auditing:4732"
    - "Microsoft-Windows-Security-Auditing:4697"
    - "Microsoft-Windows-Security-Auditing:4719"
    - "Service Control Manager:7045"

  channels:
    - name: System
    - name: Application
    - name: Setup
    # Security ist um Groessenordnungen groesser als System. Deshalb kuerzeres
    # Fenster UND serverseitiger ID-Filter - nie ungefiltert lesen.
    - name: Security
      enabled: false
      requires_admin: true
      days: 3
      with_xml: true
      event_ids: [1102, 4104, 4103, 4624, 4625, 4688, 4697, 4719, 4720, 4728, 4732]
    # Microsoft-Windows-Kernel-Power/Operational stand hier frueher. Den Kanal
    # gibt es auf Windows 11 (Build 26200, beobachtet) nicht; Kernel-Power 41
    # liegt ohnehin im System-Kanal. Wo er existiert, erfasst ihn der
    # Fehler-Sweep unten.
    - name: Microsoft-Windows-WindowsUpdateClient/Operational
    - name: Microsoft-Windows-Kernel-PnP/Configuration
    # Hinweis: WHEA-Logger (17/19) und storahci (129) sind Provider im
    # System-Kanal, keine eigenen Kanaele. 'wineventai doctor' prueft das auf
    # dem Zielsystem, statt still auf nicht existierende Kanaele zu filtern.

  # Fehler-Sweep: alle uebrigen aktiven Kanaele, aber nur Kritisch (1) und
  # Fehler (2). Die oben konfigurierten Kanaele werden ausgelassen. Ein Kanal,
  # den der Sweep nicht erreicht hat, erscheint im Bericht als "abgebrochen" -
  # nie als "keine Treffer".
  error_sweep:
    enabled: true
    levels: [1, 2]
    log_types: [Administrative, Operational]
    exclude: []
    days: null
    max_retained_per_channel: 5000
    timeout_seconds: 600

  reliability_records: true
  wer_reports: true
  minidump_listing: true
  log_files: false
  disk_health: false
  inventory: false

enrich:
  burst_factor: 5.0
  burst_min_count: 10
  context_window_minutes: 5
  context_max_events: 60
  samples_per_group: 3
  retention_error_share: 0.6
  sampling_seed: 1701

rules:
  overlay_dir: null      # null bedeutet %PROGRAMDATA%\WinEventAI\rules
  suppress_noise: true
  security_mode: false

ai:
  enabled: true
  base_url: "http://localhost:11434"
  model: "qwen2.5:14b-instruct"
  temperature: 0.1
  # Immer explizit setzen. Der Default von Ollama ist klein und schneidet lange
  # Prompts stillschweigend ab. Der tatsaechlich verwendete Wert wird zusaetzlich
  # gegen /api/show begrenzt.
  num_ctx: 16384
  timeout_seconds: 180
  max_bundle_tokens: 6000
  chars_per_token: 3.2
  max_samples_per_finding: 3
  message_excerpt_chars: 400
  allow_cloud: false     # ohne dieses Opt-in wird nur localhost akzeptiert
  redact: true

# Kontext-Sonden. Sie messen den AKTUELLEN Zustand zu einem Befund - einen
# Ping zum DNS-Server bei DNS-Client 1014, den Dienstzustand bei SCM 7031, die
# Datentraegerwerte bei disk 153. Jede Sonde haengt an einem Befund; ein Menue
# freistehender Werkzeuge gibt es bewusst nicht.
#
# Sonden laufen nur auf dem Rechner, von dem der Lauf stammt: Wer den Lauf eines
# Servers am Arbeitsplatz auswertet, bekommt keine Messung, sondern den Vermerk,
# dass sie den falschen Rechner beschreiben wuerde.
#
# Es gibt keinen Internet-Speedtest. Er braeche "offline lauffaehig", "keine
# Telemetrie" und "read-only" auf einmal.
probes:
  enabled: true
  network: true          # DNS-Server, Standardgateway, DHCP-Server
  services: true         # Dienstzustand zu SCM 7000/7009/7031/7034
  storage: true          # Gesundheit, SMART-Gesamtstatus, Belegung
  timeout_seconds: 30
  ping_count: 3
  ping_timeout_ms: 1500

report:
  formats: [html, md, json]
  redacted: false
  raw_appendix_limit: 200
  title: "WinEventAI Diagnosebericht"
