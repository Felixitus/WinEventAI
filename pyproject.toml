[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wineventai"
version = "2.0.0"
description = "Local diagnostic tool for Windows event logs with an optional local language model"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8.0", "ruff>=0.4", "PySide6>=6.6"]

[project.scripts]
wineventai = "wineventai.cli:app"

[project.gui-scripts]
wineventai-gui = "wineventai.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wineventai = [
    "config/*.yaml",
    "collect/scripts/*.ps1",
    "probes/scripts/*.ps1",
    "rules/builtin/*.yaml",
    "kb/*.yaml",
    "ai/prompts/*.txt",
    "report/templates/*.j2",
    "report/assets/*.css",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning"]
